<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta Philips Air Fryer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .promo-container {
            position: relative;
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
        }

        .offer-banner {
            background: linear-gradient(135deg, #a4d65e 0%, #8bc34a 100%);
            border-radius: 25px;
            padding: 20px 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(164, 214, 94, 0.3);
        }

        .offer-text {
            color: #2d4a22;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .mega-descuento {
            color: #1a2e14;
            font-weight: 900;
        }

        .product-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
            min-height: 400px;
        }

        .airfryer {
            width: 280px;
            height: 350px;
            background: linear-gradient(145deg, #2a2a2a 0%, #1a1a1a 50%, #000 100%);
            border-radius: 25px 25px 35px 35px;
            position: relative;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        .airfryer-top {
            width: 260px;
            height: 40px;
            background: linear-gradient(145deg, #333 0%, #1a1a1a 100%);
            border-radius: 50px;
            position: absolute;
            top: -20px;
            left: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .philips-logo {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-top: 60px;
            letter-spacing: 2px;
        }

        .display-panel {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #2a2a2a 0%, #000 100%);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #333;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .temperature {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .control-btn {
            width: 12px;
            height: 12px;
            background: #444;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .handle {
            width: 20px;
            height: 80px;
            background: linear-gradient(90deg, #333 0%, #1a1a1a 100%);
            border-radius: 10px;
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
        }

        .rapidair-tech {
            position: absolute;
            bottom: 80px;
            right: 20px;
            color: #666;
            font-size: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .price-badge {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #a4d65e 0%, #8bc34a 100%);
            clip-path: polygon(50% 0%, 55% 25%, 75% 15%, 65% 35%, 90% 35%, 70% 50%, 85% 70%, 60% 60%, 65% 85%, 50% 70%, 35% 85%, 40% 60%, 15% 70%, 30% 50%, 10% 35%, 35% 35%, 25% 15%, 45% 25%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(164, 214, 94, 0.4);
            z-index: 10;
            border: 2px solid #7cb342;
        }

        .star {
            align-items: center;
            background-color: #7cb342;
            display: flex;
            font-size: 20px;
            height: 100px;
            justify-content: center;
            margin: 0 auto;
            position: relative;
            /* transform: rotate(45deg); */
            width: 100px;

            &::before,
            &::after {
                background-color: #7cb342;
                content: '';
                display: block;
                height: 100%;
                left: 0;
                position: absolute;
                top: 0;
                width: 100%;
                z-index: -1;
            }

            &::before {
                transform: rotate(30deg);
            }

            &::after {
                transform: rotate(60deg);
            }

            p {
                transform: rotate(-45deg);
            }
        }

        .original-price {
            color: #2d4a22;
            font-size: 16px;
            font-weight: bold;
            text-decoration: line-through;
            margin-bottom: -5px;
        }

        .sale-price {
            color: #1a2e14;
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
        }

        .shipping-banner {
            position: relative;
            background: linear-gradient(135deg, #a4d65e 0%, #8bc34a 100%);
            border-radius: 20px;
            padding: 15px 25px;
            text-align: center;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(164, 214, 94, 0.3);
        }

        .shipping-text {
            color: #2d4a22;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .logo-badge {
            position: absolute;
            bottom: 0px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #a4d65e 0%, #8bc34a 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(164, 214, 94, 0.3);
        }

        .logo-text {
            color: white;
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .promo-container {
                padding: 20px;
                margin: 10px;
            }

            .offer-text {
                font-size: 16px;
            }

            .airfryer {
                width: 240px;
                height: 300px;
            }

            .price-badge {
                width: 120px;
                height: 120px;
                left: -20px;
            }

            .sale-price {
                font-size: 26px;
            }

            .original-price {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .offer-text {
                font-size: 14px;
            }

            .airfryer {
                width: 200px;
                height: 250px;
            }

            .price-badge {
                width: 100px;
                height: 100px;
                left: -15px;
            }

            .sale-price {
                font-size: 22px;
            }

            .shipping-text {
                font-size: 14px;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: "Poppins";
        }
    </style>
</head>

<body>
    <div class="promo-container">
        <!-- Top Banner -->
        <div class="offer-banner">
            <div class="offer-text">
                <strong>OFERTA LIMITADA:</strong> RESPONDE EL CUESTIONARIO Y<br>
                CONSIGUE TU AIRFRYER CON <span class="mega-descuento">MEGA DESCUENTO</span>.
            </div>
        </div>

        <div class="star" style="position:absolute; z-index: 1; top: 50%">
            <div class="original-price" style="position:absolute; z-index: 1; top: 20%">$49.990</div>
            <div class="sale-price" style="position:absolute; z-index: 1; top: 40%">$9.500</div>
        </div>

        <!-- Product Section -->
        <div class="product-section">

            <!-- Air Fryer -->
            <img src="./files/sl60prv-product.png" style="max-width: 100%;">
        </div>

        <!-- Shipping Banner -->
        <div class="shipping-banner">
            <div class="shipping-text">ENVÍO GRATIS A TODO CHILE</div>
            <!-- Logo Badge -->
            <div class="logo-badge">
                <img src="./files/sl60prv-product.png" style="max-width: 100%;">
            </div>
        </div>


    </div>
</body>

</html>
