<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
        @font-face {
            font-family: "customFont";
            src: url("files/font.otf") format("opentype");
        }

        body {
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: block;
            background-color: #f0f0f0;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            min-height: 100vh;
            padding: 40px 0;
            box-sizing: border-box;
            flex-direction: column;
        }

        .background-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: auto;
            max-width: 600px;
            z-index: -1;
            object-fit: contain;
        }

        .content-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 1;
            width: 90%;
            max-width: 600px;
            padding: 20px 40px 40px;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .heading {
            font-size: 2rem;
            font-family: "customFont";
            color: white;
            font-weight: 900;
            margin: 0;
        }

        .subheading {
            font-size: 1.5rem;
            font-family: "customFont";
            color: white;
            font-weight: 900;
            margin: 0;
        }

        .logo {
            width: 200px;
            max-width: 100%;
            margin: 0;
        }

        .survey-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin: 10px 0 0 0;
        }

        .survey-text-description {
            font-size: 1rem;
            font-weight: 400;
            color: white;
            margin: 20px 0 0 0;
            line-height: 1.5;
            max-width: 90%;
        }

        .mystery-box-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 1px 2px #444;
            margin: 0;
        }

        .product-image {
            width: 200px;
            max-width: 100%;
            margin: 0;
        }

        .survey-button {
            font-family: Poppins;
            font-weight: 500;
            font-size: 15px;
            background-color: rgb(182,86,42);
            border: 0;
            color: #fff;
            width: 200px;
            border-radius: 5px;
            height: 40px;
            margin-top: 20px;
            cursor: pointer;
        }

        .survey-button:hover {
            background-color: rgb(182,86,42);
        }

        @media (max-width: 768px) {
            .background-image {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                max-width: 100%;
                width: 100%;
                display: block;
            }

            .container {
                align-items: flex-start;
                padding-top: 0;
                min-height: auto;
                padding: 0;
                position: relative;
            }

            .content-container {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                margin-top: 0;
                padding: 10px 25px 20px;
                max-width: 85%;
                gap: 8px;
            }

            .heading {
                font-size: 1.4rem;
            }

            .subheading {
                font-size: 0.85rem;
            }

            .logo {
                width: 130px;
            }

            .survey-text {
                font-size: 0.8rem;
                margin: 5px 0 0 0;
            }

            .mystery-box-text {
                font-size: 1rem;
                margin: 5px 0;
            }

            .product-image {
                width: 130px;
            }

            .survey-text-description {
                font-size: 0.75rem;
                max-width: 95%;
                margin: 8px 0 0 0;
                line-height: 1.4;
            }

            .survey-button {
                width: 80%;
                max-width: 250px;
                margin-top: 10px;
            }
        }

        /* Specific fix for taller mobile screens */
        @media (max-width: 768px) and (min-height: 800px) {
            .content-container {
                top: 50%;
            }
        }

        @media (max-width: 480px) {
            .content-container {
                top: 50%;
                padding: 10px 20px 15px;
                gap: 6px;
            }

            .heading {
                font-size: 1.2rem;
            }

            .subheading {
                font-size: 0.7rem;
            }

            .logo {
                width: 110px;
            }

            .survey-text {
                font-size: 0.7rem;
                margin: 3px 0 0 0;
            }

            .mystery-box-text {
                font-size: 0.85rem;
                margin: 3px 0;
            }

            .product-image {
                width: 110px;
            }

            .survey-text-description {
                font-size: 0.65rem;
                margin: 5px 0 0 0;
                line-height: 1.3;
            }

            .survey-button {
                width: 85%;
                margin-top: 8px;
                height: 38px;
                font-size: 14px;
            }
        }

        /* Fix for taller small mobile screens */
        @media (max-width: 480px) and (min-height: 800px) {
            .content-container {
                top: 50%;
            }
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />
</head>

<body>
    <div class="container">
        <!-- BACKGROUND IMAGE !! -->
        <img src="./files/bgt.png" class="background-image" />

        <div class="content-container">
            <p class="heading" style="text-shadow: 10px 10px 10px #000; font-size: 17px;">FROHES ERNTEDANKFEST</p>
            <p class="subheading" style="text-shadow: 10px 10px 10px #000; font-size: 17px;">VON</p>
            <img src="./files/b1nn2xzvao.png" class="logo" />
            <p class="survey-text" style="text-shadow: 10px 10px 10px #000; font-size: 17px;">NEHMEN SIE AN EINER UMFRAGE TEIL UND <br /> GEWINNEN SIE EINE BELOHNUNG!</p>
            <p class="mystery-box-text" style="text-shadow: 10px 10px 10px #000; font-size: 17px;">Oral-B Series 9</p>
            <img src="./files/1ba4861be92060f14ec8c281fb2bca18.png" class="product-image" />
            <p class="survey-text-description" style="text-shadow: 10px 10px 10px #000; font-size: 17px;">
                Mit Ihrer Teilnahme, <br /> könnten Sie eine gewinnenOral-B Series 9!
            </p>
            <button class="survey-button">Umfrage starten</button>
        </div>
    </div>
</body>

</html>
